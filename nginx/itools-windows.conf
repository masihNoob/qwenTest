# ============================================================
# ITools - Nginx Windows + nginx-file-browser (Private only)
# HTTP (80) + HTTPS (443) + Basic Auth Private
# ============================================================
# Path WAJIB pakai forward slash: C:/folder/...
# ============================================================

# ---------- HTTP port 80 ----------
server {
    listen       80;
    server_name  _;

    root   C:/nginx/html;
    index  dashboard.html;

    client_max_body_size 100M;

    # ===== DASHBOARD =====
    location = / {
        try_files /dashboard.html =404;
    }

    location = /dashboard.html {
        try_files /dashboard.html =404;
    }

    # ===== PUBLIC - direct file =====
    # http://IP/files/public/...
    location /files/public/ {
        alias   C:/ITools/Public/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # /private tanpa slash → tambah slash
    location = /private {
        return 301 /private/;
    }

    # ===== PRIVATE - UI File Browser =====
    # Lokasi di server: C:/nginx/html/file-browser/
    location /private/ {
        auth_basic           "ITools Private - Login Required";
        auth_basic_user_file C:/nginx/htpasswd_itools;

        alias  C:/nginx/html/file-browser/;
        index  index.html;
    }

    # ===== PRIVATE - data + JSON =====
    # http://IP/files/private/...
    location /files/private/ {
        auth_basic           "ITools Private - Login Required";
        auth_basic_user_file C:/nginx/htpasswd_itools;

        alias   C:/ITools/Private/;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location ~ /\. {
        deny all;
    }
}

# ---------- HTTPS port 443 ----------
server {
    listen       443 ssl;
    server_name  _;

    root   C:/nginx/html;
    index  dashboard.html;

    ssl_certificate      C:/nginx/ssl/itools.crt;
    ssl_certificate_key  C:/nginx/ssl/itools.key;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    client_max_body_size 100M;

    location = / {
        try_files /dashboard.html =404;
    }

    location = /dashboard.html {
        try_files /dashboard.html =404;
    }

    location /files/public/ {
        alias   C:/ITools/Public/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location = /private {
        return 301 /private/;
    }

    location /private/ {
        auth_basic           "ITools Private - Login Required";
        auth_basic_user_file C:/nginx/htpasswd_itools;

        alias  C:/nginx/html/file-browser/;
        index  index.html;
    }

    location /files/private/ {
        auth_basic           "ITools Private - Login Required";
        auth_basic_user_file C:/nginx/htpasswd_itools;

        alias   C:/ITools/Private/;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location ~ /\. {
        deny all;
    }
}
